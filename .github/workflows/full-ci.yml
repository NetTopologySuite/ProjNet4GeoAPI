name: Full Continuous Integration

on: [push, pull_request]

jobs:
  pack:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macOS-latest ]

    steps:
    - name: Get source
      uses: actions/checkout@v4

    - name: Setup .NET 
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8

    - name: Build
      run: dotnet build -c Release -v minimal

    - name: Test
      run: dotnet test -c Release --no-build
      shell: bash # defaults disagree on how to quote the filter string

    - name: API compatibility gate
      if: matrix.os == 'ubuntu-latest'
      run: dotnet test test/ProjNet.Tests/ProjNet.Tests.csproj -c Release --no-build --framework net8 --filter "FullyQualifiedName~PublicApiBaselineTests"
      shell: bash

    - name: GIE/GIGS parity smoke gate
      if: matrix.os == 'ubuntu-latest'
      run: dotnet test test/ProjNet.Tests/ProjNet.Tests.csproj -c Release --no-build --framework net8 --filter "FullyQualifiedName~GieBuiltinsTheoryTests|FullyQualifiedName~Gigs5101TheoryTests"
      shell: bash

    - name: Benchmark catalog gate
      if: matrix.os == 'ubuntu-latest'
      run: dotnet run -c Release --project src/ProjNet.Benchmark/ProjNet.Benchmark.csproj -- --list flat
      shell: bash

    - name: Pack
      run: dotnet pack -c Release --no-build -o artifacts -p:NoWarn=NU5105

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: NuGet Package Files (${{ matrix.os }})
        path: artifacts

  deployToMyGet:
    name: Deploy to MyGet
    runs-on: ubuntu-latest

    needs: pack
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master')

    steps:
    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8

    - name: Download Package Files
      uses: actions/download-artifact@v4.1.7
      with:
        name: NuGet Package Files (ubuntu-latest)
        path: artifacts

    - name: Publish Package Files to MyGet
      run: dotnet nuget push artifacts/*.nupkg -s https://www.myget.org/F/nettopologysuite/api/v3/index.json -k $MYGET_API_KEY
      shell: bash
      env:
        MYGET_API_KEY: ${{ secrets.MYGET_API_KEY }}

  deployToNuGet:
    name: Deploy to NuGet
    runs-on: ubuntu-latest

    needs: pack
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8

    - name: Download Package Files
      uses: actions/download-artifact@v4.1.7
      with:
        name: NuGet Package Files (ubuntu-latest)
        path: artifacts

    - name: Publish Package Files to NuGet
      run: dotnet nuget push artifacts/*.nupkg -s https://api.nuget.org/v3/index.json -k $NUGET_API_KEY
      shell: bash
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

