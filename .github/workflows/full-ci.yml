name: Full Continuous Integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack:
    name: Build, test, and pack
    runs-on: ubuntu-latest

    steps:
    - name: Get source
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ hashFiles('Directory.Packages.props', 'dotnet-tools.json') }}
        restore-keys: |
          nuget-

    - name: Restore tools
      run: dotnet tool restore

    - name: Register .NET problem matcher
      run: echo "::add-matcher::.github/problem-matchers/dotnet.json"

    - name: Build
      run: dotnet build ProjNet4GeoAPI.sln -c Release --tl:off -v minimal

    - name: Test with coverage
      run: |
        mkdir -p coverage-out
        dotnet dotnet-coverage collect \
          --output coverage-out/coverage.cobertura.xml \
          --output-format cobertura \
          -- dotnet test --project test/ProjNet.Tests/ProjNET.Tests.csproj -c Release --no-build

    - name: Upload coverage artifact
      uses: actions/upload-artifact@v4
      with:
        name: code-coverage
        path: coverage-out/coverage.cobertura.xml
        retention-days: 30

    - name: API compatibility gate
      run: dotnet test --project test/ProjNet.Tests/ProjNET.Tests.csproj -c Release --no-build --framework net8.0 --filter "FullyQualifiedName~PublicApiBaselineTests"

    - name: GIE/GIGS parity smoke gate
      run: dotnet test --project test/ProjNet.Tests/ProjNET.Tests.csproj -c Release --no-build --framework net8.0 --filter "FullyQualifiedName~GieBuiltinsTheoryTests|FullyQualifiedName~Gigs5101TheoryTests"

    - name: Benchmark catalog gate
      run: dotnet run -c Release --project src/ProjNet.Benchmark/ProjNet.Benchmark.csproj -- --list flat

    - name: Pack
      run: dotnet pack ProjNet4GeoAPI.sln -c Release --no-build -o artifacts -p:NoWarn=NU5105

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: NuGet Package Files
        path: artifacts

  deployToMyGet:
    name: Deploy to MyGet
    runs-on: ubuntu-latest

    needs: pack
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master')

    steps:
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.201

    - name: Download Package Files
      uses: actions/download-artifact@v4
      with:
        name: NuGet Package Files
        path: artifacts

    - name: Publish Package Files to MyGet
      run: dotnet nuget push artifacts/*.nupkg -s https://www.myget.org/F/nettopologysuite/api/v3/index.json -k $MYGET_API_KEY
      shell: bash
      env:
        MYGET_API_KEY: ${{ secrets.MYGET_API_KEY }}

  deployToNuGet:
    name: Deploy to NuGet
    runs-on: ubuntu-latest

    needs: pack
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.201

    - name: Download Package Files
      uses: actions/download-artifact@v4
      with:
        name: NuGet Package Files
        path: artifacts

    - name: Publish Package Files to NuGet
      run: dotnet nuget push artifacts/*.nupkg -s https://api.nuget.org/v3/index.json -k $NUGET_API_KEY
      shell: bash
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

