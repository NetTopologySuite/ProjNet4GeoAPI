name: Mutation Tests

on:
  workflow_dispatch:
  push:
    branches:
    - develop
    paths:
    - 'src/**'
    - 'test/**'
    - 'stryker-config.json'
    - '.github/workflows/mutation-tests.yml'

permissions:
  contents: read

jobs:
  mutation:
    name: Run Stryker mutation tests
    runs-on: ubuntu-latest

    steps:
    - name: Get source
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.0.x

    - name: Restore tools
      run: dotnet tool restore

    - name: Restore dependencies
      run: dotnet restore ProjNet4GeoAPI.sln

    - name: Run mutation tests
      run: dotnet dotnet-stryker --config-file stryker-config.json

    - name: Upload mutation artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mutation-artifacts
        path: artifacts/stryker
