name: Benchmark Monitoring

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: write

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Run curated benchmarks
    runs-on: ubuntu-latest

    steps:
    - name: Get source
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ hashFiles('Directory.Packages.props', 'dotnet-tools.json') }}
        restore-keys: |
          nuget-

    - name: Restore benchmark history cache
      uses: actions/cache/restore@v4
      with:
        path: .benchmark-cache
        key: benchmark-history-${{ github.ref_name }}-${{ runner.os }}-${{ github.run_id }}
        restore-keys: |
          benchmark-history-${{ github.ref_name }}-${{ runner.os }}-

    - name: Register .NET problem matcher
      run: echo "::add-matcher::.github/problem-matchers/dotnet.json"

    - name: Build
      run: dotnet build ProjNet4GeoAPI.sln -c Release --tl:off -v minimal

    - name: Clean benchmark artifacts
      shell: bash
      run: |
        rm -rf BenchmarkDotNet.Artifacts
        mkdir -p .benchmark-cache

    - name: Run catalog and parsing benchmarks
      run: >
        dotnet run -c Release --no-build --project src/ProjNet.Benchmark/ProjNet.Benchmark.csproj --
        --artifacts BenchmarkDotNet.Artifacts
        --exporters json
        --filter "*CatalogFirstTransformationLookupBenchmarks*" "*WktParsingBenchmarks*"

    - name: Run throughput benchmarks
      run: >
        dotnet run -c Release --no-build --project src/ProjNet.Benchmark/ProjNet.Benchmark.csproj --
        --artifacts BenchmarkDotNet.Artifacts
        --exporters json
        --launchCount 1
        --warmupCount 1
        --iterationCount 3
        --filter "*ProjectionTransformBenchmarks*" "*ProjParityBenchmarks*" "*TransformationFactoryBenchmarks*"

    - name: Build benchmark regression dataset
      shell: pwsh
      run: >
        ./.github/scripts/Convert-BenchmarkReports.ps1
        -InputDirectory BenchmarkDotNet.Artifacts/results
        -OutputFile BenchmarkDotNet.Artifacts/benchmark-action-data.json

    - name: Store benchmark result
      uses: benchmark-action/github-action-benchmark@v1
      with:
        name: ProjNET Curated Benchmarks
        tool: customSmallerIsBetter
        output-file-path: BenchmarkDotNet.Artifacts/benchmark-action-data.json
        external-data-json-path: .benchmark-cache/benchmark-data.json
        github-token: ${{ secrets.GITHUB_TOKEN }}
        auto-push: false
        alert-threshold: '150%'
        fail-on-alert: false
        comment-on-alert: true
        summary-always: true

    - name: Upload benchmark artifacts
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: BenchmarkDotNet.Artifacts
        retention-days: 90

    - name: Save benchmark history cache
      if: ${{ always() && hashFiles('.benchmark-cache/benchmark-data.json') != '' }}
      uses: actions/cache/save@v4
      with:
        path: .benchmark-cache
        key: benchmark-history-${{ github.ref_name }}-${{ runner.os }}-${{ github.run_id }}
